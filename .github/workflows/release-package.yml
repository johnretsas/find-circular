name: Release to NPM

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # Staged publishing via trusted publishing (OIDC) requires npm >= 11.15.0
      - name: Update npm
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build the project
        run: npm run build

      - name: Run tests
        run: npm test

      # Goes to npm's staging area; approve it on npmjs.com (Staged Packages tab) to go live
      - name: Stage publish to npm
        run: npm stage publish --access public --provenance
